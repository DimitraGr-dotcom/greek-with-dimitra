<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Plurals - Savannah's Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; /* Light green theme */ }
        
        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .option-btn:disabled { cursor: default; }
        
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; font-weight: 800; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; opacity: 0.7; }
        .missed-correct { background-color: #fef08a !important; border-color: #eab308 !important; color: #854d0e !important; font-weight: 700; border-style: dashed; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0fdf4; }
        ::-webkit-scrollbar-thumb { background: #86efac; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #22c55e; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-lg z-10 shrink-0 border-b-4 border-emerald-400">
        <div class="max-w-4xl mx-auto px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight drop-shadow-sm">Everyday Greek Plurals 🛒</h1>
                <p class="text-emerald-100 text-lg mt-1 font-medium">New Vocabulary Practice for Savannah!</p>
            </div>
            <div class="bg-emerald-800 border-2 border-emerald-500 px-6 py-3 rounded-2xl shadow-inner flex flex-col items-center">
                <span class="text-emerald-200 text-xs uppercase tracking-widest font-bold mb-1">SCORE</span>
                <div id="score-display" class="text-3xl font-black text-white">0 / 20</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto relative p-6 lg:p-10">
        
        <div class="max-w-3xl mx-auto pb-24">
            
            <div class="bg-blue-50 border-l-4 border-blue-500 p-5 rounded-r-xl mb-8 shadow-sm">
                <h2 class="text-xl font-bold text-blue-900 mb-2">How to play! 🎮</h2>
                <p class="text-blue-800 text-lg">Learn new everyday words! Read the English translation, and choose the correct plural form in Greek (A, B, C, or D).</p>
            </div>

            <div id="questions-list" class="space-y-8">
                <!-- Questions will be injected here by JS -->
            </div>
            
            <div id="quiz-completed" class="hidden mt-12 p-10 bg-gradient-to-br from-emerald-100 to-emerald-300 border-4 border-emerald-500 rounded-3xl text-center shadow-xl">
                <div class="text-7xl mb-4 animate-bounce">🥇</div>
                <h3 class="text-4xl font-extrabold text-emerald-900 mb-4">Μπράβο Savannah! (Bravo!)</h3>
                <p class="text-2xl text-emerald-800 font-bold">You learned 20 new Greek words and their plurals!</p>
            </div>

        </div>
    </main>

    <script>
        // 20 Questions with 100% NEW everyday vocabulary!
        const quizData = [
            // Foods / Sweets
            { sing: "Ο λουκουμάς", trans: "Greek donut", options: ["A) Οι λουκουμάδες", "B) Οι λουκουμές", "C) Οι λουκουμοί", "D) Τα λουκουμάδια"], ans: 0 },
            { sing: "Ο μπακλαβάς", trans: "baklava", options: ["A) Οι μπακλαβοί", "B) Οι μπακλαβάδες", "C) Τα μπακλαβά", "D) Οι μπακλάβες"], ans: 1 },
            { sing: "Ο κιμάς", trans: "minced meat", options: ["A) Οι κιμάδες", "B) Οι κιμοί", "C) Οι κιμές", "D) Τα κιμάδια"], ans: 0 },
            { sing: "Ο μεζές", trans: "appetizer", options: ["A) Οι μεζάδες", "B) Οι μεζοί", "C) Οι μεζέδες", "D) Οι μεζές"], ans: 2 },
            { sing: "Ο χαλβάς", trans: "halva (sweet)", options: ["A) Οι χαλβές", "B) Οι χαλβοί", "C) Τα χαλβάδια", "D) Οι χαλβάδες"], ans: 3 },
            { sing: "Ο ανανάς", trans: "pineapple", options: ["A) Οι ανανές", "B) Οι ανανοί", "C) Οι ανανάδες", "D) Τα ανανάδια"], ans: 2 },
            
            // Professions
            { sing: "Ο μανάβης", trans: "greengrocer", options: ["A) Οι μανάβοι", "B) Οι μαναβήδες", "C) Οι μανάβηδες", "D) Οι μανάβες"], ans: 2 },
            { sing: "Ο χασάπης", trans: "butcher", options: ["A) Οι χασάπηδες", "B) Οι χασάποι", "C) Οι χασάπες", "D) Τα χασάπια"], ans: 0 },
            { sing: "Ο ταξιτζής", trans: "taxi driver", options: ["A) Οι ταξιτζές", "B) Οι ταξιτζήδες", "C) Οι ταξιτζοί", "D) Οι ταξιτζάδες"], ans: 1 },
            { sing: "Ο υδραυλικός", trans: "plumber", options: ["A) Οι υδραυλικοί", "B) Οι υδραυλικές", "C) Τα υδραυλικά", "D) Οι υδραυλικήδες"], ans: 0 },
            
            // Everyday items / Restaurant
            { sing: "Ο καναπές", trans: "sofa", options: ["A) Οι καναπέδες", "B) Οι καναπάδες", "C) Οι καναποί", "D) Οι καναπές"], ans: 0 },
            { sing: "Ο λογαριασμός", trans: "the bill / check", options: ["A) Οι λογαριασμοί", "B) Τα λογαριασμά", "C) Οι λογαριασμές", "D) Οι λογαριασμάδες"], ans: 0 },
            { sing: "Η απόδειξη", trans: "receipt", options: ["A) Οι αποδείξεις", "B) Οι αποδείξες", "C) Τα αποδείξια", "D) Οι απόδειξες"], ans: 0 },
            { sing: "Το πιρούνι", trans: "fork", options: ["A) Τα πιρούνες", "B) Οι πιρούνες", "C) Τα πιρούνια", "D) Τα πιρούνους"], ans: 2 },
            { sing: "Το πιάτο", trans: "plate", options: ["A) Τα πιάτες", "B) Οι πιάτοι", "C) Τα πιάτα", "D) Τα πιατάκια"], ans: 2 },
            { sing: "Η στάση", trans: "bus stop", options: ["A) Οι στάσεις", "B) Οι στάσες", "C) Τα στάσια", "D) Οι στάσηδες"], ans: 0 },
            { sing: "Το μαχαίρι", trans: "knife", options: ["A) Τα μαχαίρια", "B) Οι μαχαίρες", "C) Τα μαχαίρες", "D) Οι μαχαίροι"], ans: 0 },
            { sing: "Το ποτήρι", trans: "glass", options: ["A) Τα ποτήρια", "B) Οι ποτήρες", "C) Τα ποτηράκια", "D) Οι ποτήριοι"], ans: 0 },
            { sing: "Η χαρτοπετσέτα", trans: "napkin", options: ["A) Οι χαρτοπετσέτοι", "B) Τα χαρτοπετσέτα", "C) Οι χαρτοπετσέτες", "D) Οι χαρτοπετσέτηδες"], ans: 2 },
            { sing: "Το κουτάλι", trans: "spoon", options: ["A) Τα κουτάλες", "B) Οι κουτάλοι", "C) Τα κουτάλια", "D) Τα κουταλάκια"], ans: 2 }
        ];

        let currentScore = 0;
        let answeredQuestions = 0;

        document.addEventListener("DOMContentLoaded", () => {
            renderQuiz();
        });

        function renderQuiz() {
            const list = document.getElementById('questions-list');
            list.innerHTML = "";
            currentScore = 0;
            answeredQuestions = 0;
            updateScoreDisplay();

            quizData.forEach((q, qIndex) => {
                let html = `
                    <div class="bg-white p-7 rounded-3xl shadow-sm border-2 border-emerald-100 transition-all hover:shadow-lg" id="q-${qIndex}">
                        <div class="flex items-center justify-between mb-4">
                            <span class="bg-emerald-100 text-emerald-800 text-sm font-black px-4 py-1 rounded-full uppercase tracking-wider">Question ${qIndex + 1}</span>
                        </div>
                        <h4 class="text-3xl font-extrabold text-slate-800 mb-2">${q.sing} <span class="text-emerald-400 font-normal ml-2">➔ ?</span></h4>
                        <p class="text-slate-600 mb-6 text-lg bg-slate-100 inline-block px-4 py-1.5 rounded-lg border border-slate-200">🇬🇧 Translation: <span class="font-bold">${q.trans}</span></p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                `;

                q.options.forEach((opt, optIndex) => {
                    html += `
                        <button 
                            class="option-btn text-left p-5 rounded-2xl border-4 border-slate-100 text-xl font-bold text-slate-700 bg-slate-50 hover:border-emerald-400 hover:bg-emerald-50 focus:outline-none w-full flex items-center"
                            onclick="handleAnswer(this, ${qIndex}, ${optIndex}, ${q.ans})"
                        >
                            ${opt}
                        </button>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', html);
            });
        }

        function handleAnswer(btnElement, qIndex, selectedOptIndex, correctOptIndex) {
            const qContainer = document.getElementById(`q-${qIndex}`);
            const buttons = qContainer.querySelectorAll('button');

            // Disable buttons after selection
            buttons.forEach(btn => btn.disabled = true);
            answeredQuestions++;

            if (selectedOptIndex === correctOptIndex) {
                btnElement.classList.add('correct-answer');
                btnElement.classList.remove('bg-slate-50', 'border-slate-100', 'text-slate-700');
                currentScore++;
            } else {
                btnElement.classList.add('wrong-answer');
                btnElement.classList.remove('bg-slate-50', 'border-slate-100', 'text-slate-700');
                
                // Show the correct answer
                buttons[correctOptIndex].classList.add('missed-correct');
                buttons[correctOptIndex].classList.remove('bg-slate-50', 'border-slate-100', 'text-slate-700');
            }

            updateScoreDisplay();

            if (answeredQuestions === 20) {
                document.getElementById('quiz-completed').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('quiz-completed').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 400);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = `${currentScore} / 20`;
        }
    </script>
</body>
</html>
